<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png?v=4">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Restrito ao Painel Administrativo — ZUNKO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css?v=3">
</head>
<body class="min-h-screen bg-[#050B18] text-slate-100 flex items-center justify-center p-4 relative overflow-hidden font-sans">
  
  <!-- Glowing Background Orbs -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-cyan-500/15 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-orange-500/15 rounded-full blur-3xl pointer-events-none"></div>

  <div class="w-full max-w-md relative z-10">
    
    <!-- Card de Acesso Restrito -->
    <div class="bg-[#081229]/90 border border-cyan-500/30 rounded-3xl p-8 sm:p-10 shadow-[0_20px_60px_rgba(0,0,0,0.8),0_0_30px_rgba(0,240,255,0.15)] backdrop-blur-xl">
      
      <!-- Cabeçalho do Card -->
      <div class="text-center mb-8">
        <a href="/" class="inline-block mb-4 transition transform hover:scale-105">
          <img src="/assets/images/zunko-logo.png?v=3" alt="ZUNKO" class="h-16 w-auto mx-auto object-contain filter drop-shadow-[0_0_15px_rgba(0,102,255,0.4)]">
        </a>
        
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-cyan-950/70 border border-cyan-400/40 text-cyan-300 text-xs font-bold mb-3 shadow-[0_0_10px_rgba(0,240,255,0.2)]">
          <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
          <span>SECURITY GATE • ACESSO RESTRITO</span>
        </div>
        
        <h1 class="text-xl sm:text-2xl font-extrabold text-white">Painel de Gestão Comercial</h1>
        <p class="text-xs text-slate-400 mt-1">Identifique-se com suas credenciais de administrador</p>
      </div>

      <!-- Alerta de Erro -->
      <div id="login-error" class="hidden mb-6 p-3.5 rounded-xl bg-red-950/80 border border-red-500/50 text-red-200 text-xs flex items-center gap-2.5 animate-fadeIn">
        <svg class="w-5 h-5 text-red-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        <span id="login-error-msg">Usuário ou senha incorretos.</span>
      </div>

      <!-- Formulário de Autenticação -->
      <form id="auth-form" class="space-y-5">
        <div>
          <label for="login-user" class="block text-xs font-bold text-slate-300 mb-1.5 uppercase tracking-wider">Usuário ou E-mail</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            </span>
            <input type="text" id="login-user" required autocomplete="username" placeholder="admin ou seu e-mail" class="w-full pl-10 pr-4 py-3 bg-[#050D1E] border border-cyan-500/30 rounded-xl text-white text-sm placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/30 transition">
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="login-pass" class="block text-xs font-bold text-slate-300 uppercase tracking-wider">Senha de Segurança</label>
          </div>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </span>
            <input type="password" id="login-pass" required autocomplete="current-password" placeholder="••••••••••••" class="w-full pl-10 pr-11 py-3 bg-[#050D1E] border border-cyan-500/30 rounded-xl text-white text-sm placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/30 transition">
            <button type="button" id="toggle-pass-btn" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 transition" aria-label="Mostrar senha">
              <svg id="eye-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="w-full btn-primary py-3.5 text-sm font-bold tracking-wide flex items-center justify-center gap-2 shadow-[0_0_25px_rgba(0,240,255,0.4)] hover:shadow-[0_0_35px_rgba(0,240,255,0.6)]">
          <span>Acessar Painel Seguro</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
      </form>

      <!-- Rodapé de Segurança -->
      <div class="mt-8 pt-6 border-t border-slate-800/80 text-center text-[11px] text-slate-500 flex flex-col gap-1.5">
        <span class="flex items-center justify-center gap-1.5 text-slate-400">
          <span class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(16,185,129,0.8)]"></span>
          Conexão Segura Criptografada SSL 256-Bit
        </span>
        <span>Tentativas de login são monitoradas contra invasões.</span>
        <a href="/" class="text-cyan-400 hover:text-cyan-300 transition mt-2 font-semibold">← Voltar para o Site Oficial</a>
      </div>

    </div>

  </div>

  <script>
    const form = document.getElementById('auth-form');
    const userInput = document.getElementById('login-user');
    const passInput = document.getElementById('login-pass');
    const errorBox = document.getElementById('login-error');
    const errorMsg = document.getElementById('login-error-msg');
    const submitBtn = document.getElementById('submit-btn');
    const togglePassBtn = document.getElementById('toggle-pass-btn');

    // Toggle mostrar/ocultar senha
    togglePassBtn?.addEventListener('click', () => {
      const isPass = passInput.type === 'password';
      passInput.type = isPass ? 'text' : 'password';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <svg class="animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <span>Verificando Credenciais...</span>
      `;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            login: userInput.value,
            password: passInput.value
          })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          sessionStorage.setItem('zunko_admin_token', data.token);
          sessionStorage.setItem('zunko_admin_auth', 'true');
          sessionStorage.setItem('zunko_admin_user', data.username);
          localStorage.setItem('zunko_is_admin', 'true');
          submitBtn.innerHTML = `<span>Acesso Autorizado! Redirecionando...</span>`;
          window.location.href = '/admin';
        } else {
          errorMsg.textContent = data.error || 'Credenciais inválidas. Tente novamente.';
          errorBox.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.innerHTML = `
            <span>Acessar Painel Seguro</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
          `;
          passInput.value = '';
          passInput.focus();
        }
      } catch (err) {
        errorMsg.textContent = 'Erro de conexão com o servidor de segurança.';
        errorBox.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = `
          <span>Acessar Painel Seguro</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        `;
      }
    });
  </script>
</body>
</html>
